<head>

<style>
  :root{--bg:#000;--ink:#f5f5f7;--muted:rgba(245,245,247,.62);--accent:#ffb48a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
  main{max-width:34rem}
  h1{font-size:clamp(2rem,6vw,3.25rem);font-weight:600;line-height:1.1;letter-spacing:-.03em}
  h1 em{font-family:Georgia,serif;font-weight:400;color:var(--accent)}
  p{margin-top:16px;font-size:1.0625rem;line-height:1.55;color:var(--muted)}
  a.btn{display:inline-block;margin-top:32px;padding:14px 26px;border-radius:999px;
    background:linear-gradient(180deg,#fff,#dcdce2);color:#0a0a0f;font-weight:600;text-decoration:none;
    transition:transform .2s}
  a.btn:hover{transform:translateY(-1px)}
  a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>This site has <em>moved.</em></h1>
  <p>My portfolio now lives at amirg.dev.</p>
  <a class="btn" href="https://amirg.dev/">Go to amirg.dev →</a>
</main>
</body>
